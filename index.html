<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>갓생살기 프로젝트</title>
<meta name="description" content="운동 기록하고 친구들 약올리는 앱 — 질 수 없다!">
<meta name="theme-color" content="#2B37F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width column, sticky header, fixed bottom tab bar; highlighter-yellow taunt stickers are the one loud element */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --sunk:#E8EBF5; --line:#D9DEEC; --fg:#12152B; --muted:#5B6180;
  --accent:#2B37F0; --accent-ink:#FFFFFF; --pop:#FFD43B; --pop-ink:#2A2200; --good:#12804C; --bad:#C9302F;
  --display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0C0E1B; --surface:#161A30; --sunk:#1E2340; --line:#2B3152; --fg:#ECEEFA; --muted:#9DA3C6;
  --accent:#7D87FF; --accent-ink:#0C0E1B; --good:#4FD69A; --bad:#FF7272; color-scheme:dark } }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;display:grid;gap:16px}
.stack{display:grid;gap:14px;min-width:0}

/* header / nav */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font:400 22px/1 var(--display)}
.brand small{font:400 13px/1 var(--display);background:var(--pop);color:var(--pop-ink);padding:3px 6px 2px;margin-left:6px;display:inline-block;transform:rotate(-3deg)}
.iconbtn{border:0;background:none;font-size:20px;position:relative;padding:4px 6px}
.dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
main{padding-block:16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding-inline:4px}
.tabs button{border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:700;color:var(--muted);display:grid;justify-items:center;gap:1px}
.tabs button b{font-size:19px;line-height:1.2;font-weight:400}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button.plus b{background:var(--accent);color:var(--accent-ink);border-radius:12px;width:44px;height:30px;display:grid;place-items:center;font-size:22px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .box{width:100%;max-width:380px;display:grid;gap:14px}
.login h1{font:400 clamp(38px,11vw,52px)/1 var(--display);margin:0;text-wrap:balance}
.sticker{justify-self:start;background:var(--pop);color:var(--pop-ink);font:400 20px/1 var(--display);padding:8px 12px 7px;transform:rotate(-3deg);box-shadow:3px 3px 0 var(--fg)}
.login p{color:var(--muted);margin:4px 0 8px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* common bits */
.av{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.av.sm{width:26px;height:26px;font-size:11px}
.av.lg{width:56px;height:56px;font-size:22px}
.banner{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.rival{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.rival b{font:400 21px/1.25 var(--display)}
.rival span{font-size:13px;opacity:.85}
.goalbar{display:grid;gap:6px;font-size:13px}
.goalbar .bar,.rk .bar,.tb .bar,.ch .bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.goalbar .bar i,.rk .bar i,.tb .bar i,.ch .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ticker{display:grid;gap:6px}
.taunt{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}
.taunt.mine{color:var(--fg);font-weight:500}
.bubble{background:var(--pop);color:var(--pop-ink);padding:2px 8px;border-radius:4px;overflow-wrap:anywhere}
h2{font:400 20px/1.2 var(--display);margin:8px 0 0}
.empty{text-align:center;padding:32px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:14px;display:grid;gap:8px;justify-items:center}
.empty b{font:400 22px/1.3 var(--display);color:var(--fg)}
.hint{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){ .toast{animation:pop .25s ease-out} @keyframes pop{from{transform:translate(-50%,8px);opacity:0}} }

/* buttons & inputs */
.primary{border:0;background:var(--accent);color:var(--accent-ink);font:400 19px/1 var(--display);padding:15px;border-radius:12px;width:100%}
.primary:disabled,.ghost:disabled{opacity:.5}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-size:14px;font-weight:500}
.ghost.full{width:100%;padding:13px}
.danger{color:var(--bad)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:disabled{opacity:.5;cursor:default}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline>input{flex:1;min-width:0}
.unit{flex-wrap:nowrap;font-size:inherit;font-weight:400;letter-spacing:0;color:inherit}
.unit select{width:auto}
label{display:grid;gap:4px;min-width:0}
label>span,legend{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:0}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=range]{width:100%;accent-color:var(--accent)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
.check{display:flex;align-items:center;gap:6px;font-size:14px}
.check input{accent-color:var(--accent);width:18px;height:18px}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types label{display:block}
.types input{position:absolute;opacity:0;pointer-events:none}
.types label span{display:block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500;color:var(--fg);letter-spacing:0}
.types input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.types input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs div{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;background:var(--fg);color:var(--bg);width:22px;height:22px;border-radius:50%;font-size:12px;line-height:1}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details>summary{cursor:pointer;font-weight:700}
details[open]>summary{margin-bottom:12px}

/* feed card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div{min-width:0;flex:1}
.who strong{display:block}
.who small{color:var(--muted);font-size:12px}
.title{font-weight:700;font-size:17px;margin:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px 14px}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.05em}
.stat b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:10px}
.photos img{flex:0 0 100%;width:100%;max-height:460px;object-fit:cover;border-radius:10px;scroll-snap-align:start;background:var(--sunk)}
.photos.multi img{flex-basis:88%}
.brag{justify-self:start;background:var(--pop);color:var(--pop-ink);font-weight:700;padding:8px 12px;border-radius:4px 14px 14px 14px;overflow-wrap:anywhere;max-width:100%}
.memo{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note{margin:0;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.hot{background:var(--pop);color:var(--pop-ink)}
.reacts{display:flex;flex-wrap:wrap;gap:6px}
.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.actions button{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px}
.comments{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.cm{display:flex;gap:8px;align-items:flex-start;font-size:14px;min-width:0}
.cm>div{min-width:0;flex:1;overflow-wrap:anywhere}
.cm b{margin-right:6px}
.cm small{color:var(--muted);font-size:11px;margin-left:4px}
.cm button{border:0;background:none;color:var(--muted);font-size:12px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;padding:0;justify-self:start}

/* rank */
.controls{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.rank{display:grid;gap:8px}
.rk{display:grid;grid-template-columns:28px 36px 1fr auto;align-items:center;gap:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rk .pos{font:400 20px/1 var(--display);text-align:center}
.rk .mid{min-width:0}
.rk .mid strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .bar{margin-top:5px;height:6px}
.rk .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.poke{border:1px solid var(--fg);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;grid-column:3/5;justify-self:end}

/* crew */
.code{font:600 26px/1 var(--mono);letter-spacing:.15em}
.members{display:flex;flex-wrap:wrap;gap:10px}
.members span{display:flex;align-items:center;gap:6px;font-size:13px}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.ch header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ch header b{font-size:16px}
.ch .prow{display:grid;grid-template-columns:26px 1fr 64px;gap:8px;align-items:center;font-size:13px}
.ch .prow .val{text-align:right;font-family:var(--mono);color:var(--muted)}
.state{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.state.live{background:var(--accent);color:var(--accent-ink)}

/* me */
.profile{display:flex;align-items:center;gap:12px}
.profile b{font:400 24px/1.1 var(--display)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
.tile em{display:block;font-style:normal;font-size:12px;font-family:var(--mono)}
.up{color:var(--good)} .down{color:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.chart i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.55}
.chart div:last-child i{opacity:1}
.chart span{position:absolute;top:-16px;font:500 10px var(--mono);color:var(--muted)}
.axis{display:flex;gap:4px}
.axis span{flex:1;text-align:center;font:500 10px var(--mono);color:var(--muted);min-width:0;overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.cal .d{aspect-ratio:1;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;display:grid;align-content:space-between;font-size:11px;min-width:0;overflow:hidden}
.cal .d.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cal .d.today{outline:2px solid var(--pop);outline-offset:-2px}
.cal .d i{font-style:normal;font-size:13px;line-height:1;text-align:right}
.calhead{display:flex;justify-content:space-between;align-items:center}
.typebars{display:grid;gap:8px}
.tb{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.tb .val{text-align:right;font-family:var(--mono);color:var(--muted)}
.pbs{display:grid;gap:4px}
.pb{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:7px}
.pb b{font-family:var(--mono);text-align:right}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;display:grid;gap:2px}
.badge i{font-style:normal;font-size:26px}
.badge.off{opacity:.35;filter:grayscale(1)}
.gear{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.gear .bar{grid-column:1/3}
.recap{background:var(--fg);color:var(--bg);border-radius:14px;padding:18px;display:grid;gap:10px}
.recap b{font:400 24px/1.2 var(--display)}
.recap .ghost{background:var(--pop);color:var(--pop-ink);border:0;justify-self:start;font-weight:700}

.private{background:var(--sunk);border:1px dashed var(--muted);border-radius:12px;padding:12px 14px;font-size:13px;display:grid;gap:4px}
.private>b:first-child{font-size:15px}
.lc{width:100%;height:auto;display:block;overflow:visible}
.lc text{font:500 11px var(--mono);fill:var(--muted)}
.lc .grid{stroke:var(--line);stroke-width:1}
.lc .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.lc .area{fill:var(--accent);opacity:.12}
.lc .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100% - 32px));max-height:80vh;background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .wrap{padding:16px;max-width:none}
.nt{display:flex;gap:10px;align-items:flex-start;font-size:14px;border-bottom:1px solid var(--line);padding-block:8px}
.nt div{min-width:0;flex:1;overflow-wrap:anywhere}
.nt small{display:block;color:var(--muted);font-size:11px}
</style>
</head>
<body>

<section class="login" id="login" hidden>
  <form class="box" id="login-form" novalidate>
    <h1>갓생살기 프로젝트</h1>
    <div class="sticker">질 수 없다!</div>
    <p>운동하고, 올리고, 친구들 약올리기. 크루끼리만 보여요.</p>
    <label><span>이메일</span><input type="email" id="l-email" autocomplete="email" required></label>
    <label><span>비밀번호 (6자 이상)</span><input type="password" id="l-pw" autocomplete="current-password" minlength="6" required></label>
    <label id="l-nick-wrap" hidden><span>닉네임</span><input type="text" id="l-nick" maxlength="20" placeholder="크루에 보일 이름"></label>
    <button class="primary" id="l-submit">로그인</button>
    <button type="button" class="linkbtn" id="l-toggle">처음이에요 → 회원가입</button>
  </form>
</section>

<div id="app" hidden>
  <div class="top"><div class="wrap">
    <div class="brand">갓생살기<small>질 수 없다!</small></div>
    <button class="iconbtn" data-act="notif" aria-label="알림">🔔<span class="dot" id="notif-dot" hidden></span></button>
  </div></div>

  <main>
    <section class="wrap" id="v-feed"></section>
    <section class="wrap" id="v-rank" hidden></section>
    <section class="wrap" id="v-log" hidden>
      <form id="log-form" class="stack" novalidate>
        <h2 id="log-heading">운동 기록하기</h2>
        <fieldset><legend>운동 종류</legend>
          <div class="reacts" id="quick-types"></div>
          <select id="f-type" aria-label="전체 운동 종류"></select>
        </fieldset>
        <label><span>제목</span><input type="text" id="f-title" maxlength="60" placeholder="예: 퇴근길 한강 런"></label>
        <div class="row">
          <label><span>언제</span><input type="datetime-local" id="f-when"></label>
          <label><span>운동 시간</span><input type="text" id="f-dur" autocomplete="off" placeholder="예: 29:44 또는 1:05:00"><small class="hint" id="dur-out">분:초 또는 시:분:초. "45"만 쓰면 45분</small></label>
        </div>
        <div class="row" id="dist-row">
          <label><span>거리</span><span class="inline unit"><input type="number" id="f-dist" min="0" step="any" inputmode="decimal" placeholder="5.00"><select id="f-unit" aria-label="거리 단위"><option value="km">km</option><option value="m">m</option></select></span></label>
          <label><span>상승고도 (m)</span><input type="number" id="f-elev" min="0" inputmode="numeric" placeholder="선택"></label>
        </div>
        <div class="row">
          <label><span>칼로리 (kcal)</span><input type="number" id="f-kcal" min="0" inputmode="numeric" placeholder="비우면 자동 계산"></label>
          <label><span>평균 심박 (bpm)</span><input type="number" id="f-hr" min="30" max="230" inputmode="numeric" placeholder="선택"></label>
        </div>
        <p class="hint" id="kcal-basis"></p>
        <label><span>체감 강도 <output id="rpe-out" class="num">5</output>/10</span><input type="range" id="f-rpe" min="1" max="10" value="5"></label>
        <label><span>장비</span><select id="f-gear"></select></label>
        <label><span>사진 (최대 10장)</span><input type="file" id="f-photo" accept="image/*" multiple></label>
        <div class="thumbs" id="thumbs"></div>
        <label><span>약올리기 한마디</span><input type="text" id="f-brag" maxlength="80" placeholder="나 이만큼 했지롱"></label>
        <div class="reacts" id="brag-presets"></div>
        <label><span>메모 (크루에게 보임)</span><textarea id="f-memo" maxlength="1000" placeholder="코스, 컨디션, 세트 기록 등"></textarea></label>
        <label><span>🔒 비공개 메모 (나만 보임)</span><textarea id="f-note" maxlength="1000" placeholder="부상, 체중, 혼자 볼 기록"></textarea></label>
        <fieldset><legend>공개 설정</legend>
          <div class="inline">
            <label class="check"><input type="radio" name="vis" id="vis-crew" value="crew" checked>크루 공개</label>
            <label class="check"><input type="radio" name="vis" id="vis-private" value="private">나만 보기</label>
            <label class="check"><input type="checkbox" id="f-commute">출퇴근</label>
          </div>
          <div class="inline">
            <span class="hint">크루에게 숨길 항목:</span>
            <label class="check"><input type="checkbox" id="hide-pace">페이스</label>
            <label class="check"><input type="checkbox" id="hide-hr">심박</label>
            <label class="check"><input type="checkbox" id="hide-kcal">칼로리</label>
          </div>
        </fieldset>
        <button class="primary" id="f-submit">올리고 약올리기</button>
        <button type="button" class="ghost full" id="f-cancel" hidden>수정 취소</button>
      </form>
    </section>
    <section class="wrap" id="v-crew" hidden></section>
    <section class="wrap" id="v-me" hidden></section>
  </main>

  <nav class="tabs"><div class="wrap" role="tablist">
    <button role="tab" data-tab="feed"><b>🏠</b>피드</button>
    <button role="tab" data-tab="rank"><b>🏆</b>랭킹</button>
    <button role="tab" data-tab="log" class="plus"><b>＋</b>기록</button>
    <button role="tab" data-tab="crew"><b>👥</b>크루</button>
    <button role="tab" data-tab="me"><b>📈</b>나</button>
  </div></nav>
</div>

<dialog id="notif"><div class="wrap">
  <div class="inline" style="justify-content:space-between"><h2 style="margin:0">알림</h2><button class="ghost" data-act="close-notif">닫기</button></div>
  <div id="notif-list"></div>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
