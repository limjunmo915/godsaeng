<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>갓생살기 프로젝트</title>
<meta name="description" content="운동 기록하고 친구들 약올리는 앱 — 질 수 없다!">
<meta name="theme-color" content="#3D2EFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<section class="login" id="login" hidden>
  <form class="login-box" id="login-form" novalidate>
    <div class="wordmark lg">갓생살기<i></i></div>
    <p class="slogan">질 수 없다</p>
    <p class="lead">운동하고, 올리고, 친구들 약올리기. 크루와 친구끼리만 보여요.</p>
    <p class="invited" id="l-invited" hidden>친구 초대를 받았어요! 가입하거나 로그인하면 바로 친구가 돼요.</p>
    <label class="field"><span>이메일</span><input type="email" id="l-email" autocomplete="email" required></label>
    <label class="field"><span>비밀번호 (6자 이상)</span><input type="password" id="l-pw" autocomplete="current-password" minlength="6" required></label>
    <label class="field up-only" hidden><span>닉네임</span><input type="text" id="l-nick" maxlength="20" placeholder="크루에 보일 이름"></label>
    <label class="field up-only" hidden><span>생년월일 (만 14세 이상 확인용, 저장하지 않아요)</span><input type="date" id="l-bd" min="1900-01-01"></label>
    <label class="check up-only" hidden><input type="checkbox" id="l-agree"><span><a href="terms.html" target="_blank" rel="noopener">이용약관</a>과 <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>(국외 이전 포함)에 동의합니다</span></label>
    <button class="btn primary wide" id="l-submit">로그인</button>
    <button type="button" class="linkbtn center" id="l-toggle">처음이에요 · 회원가입</button>
    <button type="button" class="linkbtn center in-only" id="l-forgot">비밀번호를 잊었어요</button>
    <p class="legal"><a href="terms.html" target="_blank" rel="noopener">이용약관</a> · <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a></p>
  </form>
</section>

<div id="app" hidden>
  <header class="topbar"><div class="wrap">
    <div class="wordmark"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <path class="mk-line" d="M11.6 12.6 12.5 4.6Q12.7 3.4 13.9 3.4H18.1Q19.3 3.4 19.5 4.6L20.4 12.6"/>
      <ellipse class="mk-line" cx="16" cy="13" rx="14" ry="3"/>
      <path class="mk-heart" d="M16 29C9 24 6 20.5 6 17 6 14 8.2 12 10.8 12 13 12 14.6 13.2 16 15 17.4 13.2 19 12 21.2 12 23.8 12 26 14 26 17 26 20.5 23 24 16 29Z"/>
      <path class="mk-beat" d="M4 20H11.5L13.3 16.5 15.6 23.5 18 18 19.4 20H28"/>
    </svg>갓생살기</div>
    <button class="icbtn" data-act="notif" aria-label="알림"><i data-ic="bell"></i><span class="dot" id="notif-dot" hidden></span></button>
  </div></header>

  <main>
    <section class="view feed" id="v-feed"></section>
    <section class="view wrap" id="v-rank" hidden></section>
    <section class="view wrap" id="v-log" hidden>
      <form id="log-form" class="stack" novalidate>
        <h2 class="page-title" id="log-heading">운동 기록</h2>

        <fieldset class="group">
          <legend>운동 종류</legend>
          <div class="chips" id="quick-types"></div>
          <label class="field"><span>전체 종목</span><select id="f-type"></select></label>
        </fieldset>

        <fieldset class="group">
          <legend>기록</legend>
          <label class="field"><span>제목</span><input type="text" id="f-title" maxlength="60" placeholder="퇴근길 한강 런"></label>
          <div class="row">
            <label class="field"><span>언제</span><input type="datetime-local" id="f-when"></label>
            <label class="field"><span>운동 시간</span><input type="text" id="f-dur" autocomplete="off" inputmode="text" placeholder="29:44"><small class="hint" id="dur-out"></small></label>
          </div>
          <div class="row" id="dist-row">
            <label class="field"><span>거리</span><span class="unit"><input type="number" id="f-dist" min="0" step="any" inputmode="decimal"><select id="f-unit" aria-label="거리 단위"><option value="km">km</option><option value="m">m</option></select></span></label>
            <label class="field"><span>상승고도 (m)</span><input type="number" id="f-elev" min="0" inputmode="numeric" placeholder="선택"></label>
          </div>
          <div class="row">
            <label class="field"><span>칼로리 (kcal)</span><input type="number" id="f-kcal" min="0" inputmode="numeric"></label>
            <label class="field"><span>평균 심박 (bpm)</span><input type="number" id="f-hr" min="30" max="230" inputmode="numeric" placeholder="선택"></label>
          </div>
          <p class="hint" id="kcal-basis"></p>
          <label class="field"><span>체감 강도 <output id="rpe-out" class="num">5</output> / 10</span><input type="range" id="f-rpe" min="1" max="10" value="5"></label>
          <label class="field" id="gear-field"><span>장비</span><select id="f-gear"></select></label>
        </fieldset>

        <fieldset class="group">
          <legend>사진과 약올리기</legend>
          <label class="upload"><i data-ic="camera"></i><span>사진 추가 (최대 10장)</span><input type="file" id="f-photo" accept="image/*" multiple></label>
          <div class="thumbs" id="thumbs"></div>
          <label class="field"><span>약올리기 한마디</span><input type="text" id="f-brag" maxlength="80" placeholder="나 이만큼 했지롱"></label>
          <div class="chips" id="brag-presets"></div>
          <label class="field"><span>메모 (크루에게 보임)</span><textarea id="f-memo" maxlength="1000" placeholder="코스, 컨디션, 세트 기록"></textarea></label>
          <label class="field"><span>비공개 메모 (나만 보임)</span><textarea id="f-note" maxlength="1000" placeholder="부상, 혼자 볼 기록"></textarea></label>
        </fieldset>

        <fieldset class="group">
          <legend>공개 설정</legend>
          <div class="checks">
            <label class="check"><input type="radio" name="vis" id="vis-crew" value="crew" checked>크루·친구 공개</label>
            <label class="check"><input type="radio" name="vis" id="vis-private" value="private">나만 보기</label>
            <label class="check"><input type="checkbox" id="f-commute">출퇴근</label>
          </div>
          <p class="hint">크루에게 숨길 항목</p>
          <div class="checks">
            <label class="check"><input type="checkbox" id="hide-pace">페이스</label>
            <label class="check"><input type="checkbox" id="hide-hr">심박</label>
            <label class="check"><input type="checkbox" id="hide-kcal">칼로리</label>
          </div>
        </fieldset>

        <button class="btn primary wide" id="f-submit">올리고 약올리기</button>
        <button type="button" class="btn wide" id="f-cancel" hidden>수정 취소</button>
      </form>
    </section>
    <section class="view wrap" id="v-crew" hidden></section>
    <section class="view wrap" id="v-me" hidden></section>
  </main>

  <nav class="tabs" aria-label="메뉴"><div class="wrap">
    <button data-tab="feed" aria-selected="true"><i data-ic="home"></i><span>피드</span></button>
    <button data-tab="rank" aria-selected="false"><i data-ic="trophy"></i><span>랭킹</span></button>
    <button data-tab="log" aria-selected="false" class="plus" aria-label="운동 기록"><b><i data-ic="plus"></i></b></button>
    <button data-tab="crew" aria-selected="false"><i data-ic="users"></i><span>크루</span></button>
    <button data-tab="me" aria-selected="false"><i data-ic="user"></i><span>나</span></button>
  </div></nav>
</div>

<dialog id="notif" aria-labelledby="notif-title">
  <div class="sheet-head"><h2 id="notif-title">알림</h2><button class="icbtn" data-act="close-notif" aria-label="닫기"><i data-ic="x"></i></button></div>
  <div id="notif-list"></div>
</dialog>

<dialog id="fb" aria-labelledby="fb-title">
  <div class="sheet-head"><h2 id="fb-title">건의·버그 제보</h2><button class="icbtn" data-act="close-fb" aria-label="닫기"><i data-ic="x"></i></button></div>
  <form class="stack sheet-body" id="fb-form" data-form="feedback">
    <input type="hidden" name="mode"><input type="hidden" name="workout_id"><input type="hidden" name="comment_id"><input type="hidden" name="target_user"><input type="hidden" name="snapshot">
    <label class="field" id="fb-kind"><span>종류</span><select name="kind"><option value="idea">건의·바라는 기능</option><option value="bug">버그·오류</option><option value="etc">기타 문의</option></select></label>
    <label class="field" id="fb-reason" hidden><span>신고 사유</span><select name="reason"><option>욕설·괴롭힘</option><option>부적절한 사진</option><option>가짜·조작 기록</option><option>스팸·광고</option><option>기타</option></select></label>
    <label class="field"><span>내용</span><textarea name="body" maxlength="1000"></textarea></label>
    <p class="hint">운영자만 볼 수 있어요. 신고해도 상대에게 누가 신고했는지 알리지 않아요.</p>
    <label class="check" id="fb-block"><input type="checkbox" name="block">이 사람도 차단하기</label>
    <button class="btn primary wide">보내기</button>
    <button type="button" class="linkbtn center" id="fb-block-only" data-act="block">신고 없이 차단만 하기</button>
  </form>
</dialog>

<dialog id="profile" aria-label="프로필">
  <div class="sheet-head"><h2>프로필</h2><button class="icbtn" data-act="close-profile" aria-label="닫기"><i data-ic="x"></i></button></div>
  <div class="sheet-body" id="profile-body"></div>
</dialog>
<dialog id="photo-view" class="viewer" aria-label="프로필 사진 크게 보기"><img alt="프로필 사진"></dialog>

<dialog id="pw-reset" aria-labelledby="pw-title">
  <div class="sheet-head"><h2 id="pw-title">새 비밀번호 정하기</h2></div>
  <form class="stack sheet-body" data-form="newpw">
    <label class="field"><span>새 비밀번호 (6자 이상)</span><input type="password" name="pw" minlength="6" autocomplete="new-password"></label>
    <button class="btn primary wide">비밀번호 바꾸기</button>
  </form>
</dialog>

<dialog id="terms-gate" aria-labelledby="terms-title">
  <div class="sheet-head"><h2 id="terms-title">약관 동의</h2></div>
  <form class="stack sheet-body" data-form="terms">
    <p>갓생살기를 계속 쓰려면 이용약관과 개인정보처리방침에 동의해 주세요.</p>
    <p class="legal left"><a href="terms.html" target="_blank" rel="noopener">이용약관 보기</a> · <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침 보기</a></p>
    <label class="field" id="t-bd-wrap"><span>생년월일 (만 14세 이상 확인용, 저장하지 않아요)</span><input type="date" name="birthdate" min="1900-01-01"></label>
    <label class="check"><input type="checkbox" name="agree">이용약관과 개인정보처리방침(국외 이전 포함)에 동의합니다</label>
    <button class="btn primary wide">동의하고 계속하기</button>
  </form>
</dialog>

<script type="module" src="./main.js"></script>
</body>
</html>
