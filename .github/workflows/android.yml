# 안드로이드 시험용 APK: main 에 push 하면 빌드 → 릴리스 'android' 에 godsaeng.apk 로 올림
# 받는 주소: https://github.com/limjunmo915/godsaeng/releases/download/android/godsaeng.apk
# 업로드 키(Secrets: UPLOAD_KEYSTORE_B64, UPLOAD_STORE_PASSWORD)가 있으면 Play 스토어용 AAB 도 만들어 Actions 결과물 godsaeng-aab 로 올림
name: android
on:
  push:
    branches: [main]
    paths: [src/**, android/**, package.json, package-lock.json, capacitor.config.json, .github/workflows/android.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk godsaeng.apk
      # Play 스토어용 AAB: 업로드 키(비밀)를 넣어 둔 뒤부터 자동으로 만들어 Actions 결과물(godsaeng-aab)로 올림
      - name: 스토어용 AAB(업로드 키 서명)
        if: ${{ env.HAS_UPLOAD_KEY == 'true' }}
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > app/upload.p12
          ./gradlew bundleRelease --no-daemon
          rm app/upload.p12
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_UPLOAD_KEY == 'true' }}
        with:
          name: godsaeng-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --prerelease --title "안드로이드 시험판" --notes "폰에 직접 설치하는 시험용 앱. main 에 올릴 때마다 새로 만들어짐."
          gh release upload android godsaeng.apk --clobber
